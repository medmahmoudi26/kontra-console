# The console's own gate.
#
# WHY IT EXISTS AT ALL. This suite had no CI job for most of its life, which is how two real UI
# regressions rode a fully green branch in August 2026: `workflowSource.ts` stopped recognising a
# promoted Dataset as a write, and the Workflows page under-reported a workflow's outputs. Every
# gated suite was green the whole time, because ~1100 of these tests were running only when someone
# remembered. The job was added in kontra and moved here with the source (ADR 0038).
name: ci

on:
  push:
    branches: [dev, main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    name: console
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: kontra-console
          persist-credentials: false

      # THE SIBLING CHECKOUT, AND WHY IT IS STILL HERE.
      #
      # `@kontra/core` is the shared kernel — the contract types, the Transcript reader, the
      # Warden's vocabulary, the queue derivations. It is a real dependency now rather than a
      # `../backend/src` path alias, which is what let this repository leave kontra at all. But it
      # is NOT PUBLISHED YET, so `package.json` names it `link:../kontra/shared/core` and there has to be
      # a `../kontra` to link to.
      #
      # This step is the one thing standing between here and a self-contained build. When
      # `@kontra/core` goes to npm, this checkout and the build step below both go away and the
      # dependency becomes an ordinary version range.
      #
      # NO TOKEN. kontra is public (verified 2026-10-07), and this job used to refuse to run without
      # a `KONTRA_CORE_TOKEN` that was only ever needed while it was private — so every run failed
      # in its first step and nothing about the console was checked.
      #
      # WHICH KONTRA: the branch named like this change's head wins, then its base, then kontra's
      # default — kontra's own CI picks the console the same way, so a change that needs both
      # repositories is two branches with one name. Names travel through `env:`, never through
      # `${{ }}` inside the script, because a branch name on a fork's pull request is
      # attacker-chosen text.
      - name: which kontra branch goes with this change
        id: kontra
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          PUSH_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          url=https://github.com/medmahmoudi26/kontra
          ref=""
          for want in "$HEAD_REF" "$BASE_REF" "$PUSH_REF"; do
            [ -n "$want" ] || continue
            if git ls-remote --exit-code --heads "$url" "refs/heads/$want" >/dev/null 2>&1; then
              ref="$want"
              break
            fi
          done
          echo "kontra at ${ref:-its default branch}"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: medmahmoudi26/kontra
          path: kontra
          ref: ${{ steps.kontra.outputs.ref }}
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: kontra-console/pnpm-lock.yaml

      # THE PACKAGE IS BUILT, NOT RESOLVED FROM SOURCE, and the distinction is the subject of
      # ADR 0041. `@kontra/core` ships JavaScript because Temporal's Workflow bundler excludes
      # node_modules from its TypeScript loader; nothing here consumes `core/src` directly, so a
      # missing build is a resolution failure rather than a slow path.
      - name: build @kontra/core
        working-directory: kontra
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @kontra/core run build

      - name: pnpm install
        working-directory: kontra-console
        run: pnpm install --frozen-lockfile

      # `typecheck` is `src` alone. `typecheck:e2e` is the Playwright harness, which constructs a
      # real PanelServer out of the orchestrator's source — it is a separate tsconfig precisely so
      # that the sibling requirement is visible instead of being an obscure failure in the main one.
      - name: typecheck (tsc --noEmit)
        working-directory: kontra-console
        run: pnpm run typecheck

      - name: typecheck the e2e harness (needs the kontra checkout)
        working-directory: kontra-console
        run: pnpm run typecheck:e2e

      - name: vitest
        working-directory: kontra-console
        run: pnpm test

      # THE BUNDLE IS PART OF THE GATE. A suite that passes and a build that fails is a state this
      # repository has been in: rollup reads a CommonJS dependency as one default export, so
      # `@kontra/core` being CJS-only failed `vite build` with `"workflowScratchId" is not exported
      # by dist/scratch.js` while every test passed. Only a build catches that.
      #
      # NO EXPLORE TOKEN HERE, deliberately. `VITE_KONTRA_EXPLORE_TOKEN` is baked into the bundle at
      # build time, and a token inside a browser bundle is not private from anyone who loads the
      # page. CI builds without one; a deployment supplies it.
      - name: build the SPA
        working-directory: kontra-console
        run: pnpm run build
